#textdomain wesnoth-tsotra
[scenario]
    id=dwarves_03
    next_scenario=dwarves_04
    name= _ "Rescuing Arbald"
    map_data="{~add-ons/The_Secret_of_the_Red_Anvil/maps/03.map}"
    victory_when_enemies_defeated=no
    carryover_percentage=40
    carryover_add=yes
    {DEFAULT_SCHEDULE}
    {TURNS 40 37 34}

    {INTRO_AND_SCENARIO_MUSIC revelation.ogg breaking_the_chains.ogg}
    {EXTRA_SCENARIO_MUSIC vengeful.ogg}
    {EXTRA_SCENARIO_MUSIC battle.ogg}
    {EXTRA_SCENARIO_MUSIC casualties_of_war.ogg}

    [story]
        [part]
            [background_layer]
                image=story/landscape-hills-01.webp
                scale_vertically=no
            [/background_layer]
            story= _ "The Dwarves drew ever closer to the elvish city. Each of them feared they were about to be riddled with elvish arrows like a hedgehog, but that didn’t happen. To everyone’s surprise, Farin’s party reached the elvishj gates..."
        [/part]
    [/story]

    [side]
        side=1
        {SIDE_1_ESSENTIALS}
        {SIDE_1_GOLD_FIXED 150 100}
        {FARIN}
        fog=no
        shroud=no
#ifndef MULTIPLAYER
        [unit]
            {BRIM}
            location_id=2
        [/unit]
#endif
    [/side]

    [side]
        side=2
        {SIDE_2_ESSENTIALS}
        {BRIM}
        gold=100
        fog=no
        shroud=no
    [/side]

    [side]
        side=3
        {UNPLAYABLE_SIDE}
        team_name=elves
        user_team_name= _ "Elves"
        {FLAG_VARIANT wood-elvish}
        hidden=no 
        type=Elvish Lord
        id=Nythalos
        name=_ "Lord Nythalos"
        {GOLD 230 270 340}
        {INCOME 3 5 10}
        recruit=Elvish Fighter, Elvish Archer, Elvish Shaman, Elvish Captain, Elvish Hero, Elvish Druid, Elvish Sorceress, Elvish Marksman, Elvish Ranger 
        [ai]
            passive_leader=yes 
        [/ai]
    [/side]

    [side]
        side=4
        {UNPLAYABLE_SIDE}
        team_name=elves
        user_team_name= _ "Elves"
        {FLAG_VARIANT wood-elvish}
        hidden=yes
        recruit=Elvish Fighter, Elvish Archer, Elvish Shaman, Elvish Scout
        [ai]
            passive_leader=yes 
        [/ai]
    [/side]

    [side]
        side=5
        {UNPLAYABLE_SIDE}
        team_name=elves
        user_team_name= _ "Elves"
        {FLAG_VARIANT wood-elvish}
        hidden=yes
        recruit=Elvish Fighter, Elvish Archer, Elvish Shaman, Elvish Scout
        [ai]
            passive_leader=yes 
        [/ai]
    [/side]

    {STARTING_VILLAGES_ALL 3}

    [event]
    name=prestart 

        [recall]
            id=Rashakan 
            placement=leader 
        [/recall]
    [/event]

    [event]
    name=start 

        [message]
            speaker=Farin 
            message= _ "Listen here, elves! We know you hold Arbald. Let him go, and we'll part away without trouble!"
        [/message]
        [message]
            speaker=Nythalos
            message= _ "What are you doing here? Wild beasts should have torn you to pieces!"
        [/message]
        [message]
            speaker=Farin 
            message= _ "Our hammers had other plans. Free Arbald if you don't want to get to know them better."
        [/message]
        [message]
            speaker=Nythalos
            message= _ "Spare me your pitiful threats, dwarf, and go back to your caves. We'll let Arbald go when he teaches us how to forge steel armour for the elves."
        [/message]
        [message]
            speaker=Brim
            message= _ "<i>So, that quarrel wasn't for nothing...</i>"
        [/message]
        [message]
            speaker=Farin
            message= _ "Nonsense! Arbald will never reveal his secrets to you!"
        [/message]
        [message]
            speaker=Nythalos
            message= _ "Maybe not now. But you dwarves cherish your craft too much, and Arbald isn't young. When he feels his death approaching, do you think he'll let his secrets perish with him? I doubt it. And I have enough time to find out."
        [/message]
        [message]
            speaker=Farin
            message= _ "And what makes you think Arbald's secrets would perish with him?"
        [/message]
        [message]
            speaker=Nythalos
            message= _ "It's obvious. Arbald hasn't passed them on to any of you yet, otherwise you wouldn't rush to save him so desperately."
        [/message]
        [message]
            speaker=Brim
            message= _ "If you need that armour so much, why wouldn't you just buy it from us? Why start a war?"
        [/message]
        [message]
            speaker=Nythalos
            message= _ "Orcs are growing stronger and stronger. I won't let the survival of my people depend on your ever-changing interests. Moreover, how can I be sure the orcs won't conquer you? You're barely able to drive the trolls away from your borders!"
        [/message]
        [message]
            speaker=Farin
            message= _ "Scumbag! You took advantage of the trolls' raid, I wouldn't be surprised to learn you sent them youself!"
        [/message]
        [message]
            speaker=Nythalos
            message= _ "I have spoken. Go away or perish by our arrows."
        [/message]
        [message]
            speaker=Farin
            message= _ "I won't go without Arbald! Forward, lads, let the steel muffle their arrogant speeches!"
        [/message]

        {HIGHLIGHT_IMAGE 18 15 "units/dwarves/arcanister.png~RC(magenta>red)~BLIT(items/cage.png)" ()}

        [objectives]
            side=1,2
            [objective]
                [show_if]
                    [not]
                        [have_unit]
                            id=Arbald 
                        [/have_unit]
                    [/not]
                [/show_if]
                description=_ "Move Farin or Brim to the elvish prison"
                condition=win 
            [/objective]
            [objective]
                [show_if]
                    [have_unit]
                        id=Arbald 
                    [/have_unit]
                [/show_if]
                description=_ "Move Farin or Brim to the dwarvish village in north-east mountains"
                condition=win 
            [/objective]
            [objective]
                description=_ "Death of Farin"
                condition=lose
            [/objective]
            [objective]
                description=_ "Death of Brim"
                condition=lose
            [/objective]
            [objective]
                [show_if]
                    [have_unit]
                        id=Arbald 
                    [/have_unit]
                [/show_if]
                description=_ "Death of Arbald the Iron"
                condition=lose
            [/objective]
            {TURNS_RUN_OUT}
            [gold_carryover]
                carryover_percentage=40
                bonus=yes
            [/gold_carryover]
        [/objectives]
    [/event]

    {TSOTRA_RUNIC_CHEST_FORCE 9 28}
    {TSOTRA_RUNIC_CHEST_SWIFTNESS 11 29}

    [event]
    name=moveto 

        [filter]
            race=dwarf 
            canrecruit=yes 
            x=18
            y=15
        [/filter]

        {REMOVE_IMAGE 18 15}
        [unit]
            type=Dwarvish Arcanister 
            id=Arbald
            name=_ "Arbald the Iron"
            {IS_HERO}
            unrenamable=yes 
            [modifications]
                {TRAIT_AGED}
                {TRAIT_QUICK}
            [/modifications]
            side=$unit.side 
            animate=yes 
            x,y=18,15
        [/unit]

        [message]
            speaker=Arbald 
            message= _ "Which of you dumbheads told the elves that I can forge armour for them!?"
        [/message]
        [message]
            speaker=Farin
            message= _ "I did, master, but isn't it true?"
        [/message]
        [message]
            speaker=Arbald
            message= _ "Farin, you idiot! Even if it were possible, why on earth should the elves know that?!"
        [/message]
        [message]
            [show_if]
                [have_unit]
                    id=Rashakan 
                [/have_unit]
            [/show_if]
            speaker=Arbald
            message= _ "And what in the blazes is that dragon doing with you?!"
        [/message]
        [message]
            speaker=Brim
            message= _ "Let's settle this back home, master. We need to get out of here."
        [/message]
        [message]
            speaker=Arbald
            message= _ "Brim! At least there's one dwarf here with a good head on his shoulders! But how, by the Ancestors, are we supposed to escape the elves in their own forest?!"
        [/message]
        [message]
            speaker=Farin
            message= _ "I see hills to the north-east. There we can outrun them."
        [/message]
        [message]
            speaker=Arbald
            message= _ "Silence, Farin... Though that's a good idea! What are you standing there for? Run!"
        [/message]

        {HIGHLIGHT_IMAGE 31 1 items/gohere.png ()}
        [show_objectives][/show_objectives]
    [/event]

    [event]
    name=moveto 

        [filter]
            race=dwarf 
            canrecruit=yes 
            x=31
            y=1
        [/filter]

        [filter_condition] 
            [have_unit]
                id=Arbald 
            [/have_unit]
        [/filter_condition]

        [message]
            speaker=unit
            message= _ "We shook them off!"
        [/message]

        [message]
            speaker=Arbald
            message= _ "Once we get home, I’ll skin you both alive!"
        [/message]

        [endlevel]
            result=victory 
        [/endlevel]
    [/event]

    [event]
    name=turn 7 

        [unit]
            side=4
            type=Elvish Hero 
            generate_name=yes 
            canrecruit=yes 
            x,y=27,31 
        [/unit]

        {MOVE_UNIT side=4 27 30}

        [terrain]
            x,y=27,30
            terrain=Ke 
        [/terrain]
        [terrain]
            x=26,27,28 
            y=29,29,29
            terrain=Ce 
        [/terrain]
        [redraw][/redraw]
        [modify_side]
            side=4
            {GOLD 100 130 150}
            {INCOME 5 10 15}
            hidden=no
            [ai]
                passive_leader=yes
                [goal]
                    name=target_unit 
                    [criteria]
                        race=dwarf 
                        canrecruit=yes 
                    [/criteria]
                    value=5 
                [/goal]
            [/ai]
        [/modify_side]

        [unit]
            side=5
            type=Elvish Marksman
            generate_name=yes 
            gender=female
            canrecruit=yes 
            x,y=16,1
        [/unit]

        {MOVE_UNIT side=5 16 2}

        [terrain]
            x,y=16,2
            terrain=Ke 
        [/terrain]
        [terrain]
            x=15,16,17
            y=3,3,3
            terrain=Ce 
        [/terrain]
        [redraw][/redraw]
        [modify_side]
            side=5
            {GOLD 100 130 150}
            {INCOME 5 10 15}
            hidden=no
            [ai]
                passive_leader=yes
                [goal]
                    name=target_unit 
                    [criteria]
                        race=dwarf 
                        canrecruit=yes 
                    [/criteria]
                    value=5 
                [/goal]
            [/ai]
        [/modify_side]

        [message]
            side=4 
            canrecruit=yes
            message= _ "We have come at your summons, My Lord."
        [/message]

        [message]
            speaker=Nythalos
            message= _ "Seize the intruders and throw them into the dungeon!"
        [/message]

        [message]
            speaker=Brim
            message= _ "Uh-oh. The elves are surrounding us."
        [/message]

        [message]
            speaker=Farin
            message= _ "*gulp*"
        [/message]
    [/event]
    [event]
    name=last breath 

        [filter]
            id=Nythalos 
        [/filter]

        [message]
            speaker=unit 
            message= _ "I won't fall by a dwarf's hand!"
        [/message]

        {FLASH_GREEN (
            [sound]
                name=magic-faeriefire.ogg 
            [/sound]
            [kill]
                id=Nythalos 
                animate=no 
            [/kill]
        )}

        [message]
            speaker=Farin
            message= _ "Coward! He fled with his magic tricks!"
        [/message]

        [message]
            speaker=Brim
            message= _ "We'll be in trouble when he returns. We have to hurry."
        [/message]
    [/event]
    {HERODEATHS}
[/scenario]
